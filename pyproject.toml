[project]
name = "microdrop-dev-hooks"
version = "0.1.0"
description = "Shared pre-commit hooks and lint baselines for the MicroDrop repos"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stamp-import-sections = "microdrop_dev_hooks.stamp_import_sections:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microdrop_dev_hooks"]
